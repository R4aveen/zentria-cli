name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_ZIP: build/Zentria-CLI-${{ github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Validar tag vs package.json
        shell: pwsh
        run: |
          $pkgVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($pkgVersion -ne $tagVersion) {
            Write-Error "Version mismatch: package.json=$pkgVersion, tag=${{ github.ref_name }}"
            exit 1
          }
          Write-Host "✓ Versiones alineadas: v$pkgVersion"

      - name: Crear certificado y compilar
        run: node scripts/build-exe.mjs

      - name: Verificar ZIP generado
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.RELEASE_ZIP }}")) {
            Write-Error "No se encontró el ZIP esperado: ${{ env.RELEASE_ZIP }}"
            Get-ChildItem build -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "✓ ZIP listo: ${{ env.RELEASE_ZIP }}"

      - name: Subir ZIP compilado como Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ZIP }}
          name: Zentria CLI ${{ github.ref_name }}
          body: |
            ## Instrucciones
            1. Descarga **Zentria-CLI-${{ github.ref_name }}.zip**
            2. Descomprime el ZIP
            3. Doble clic en **Iniciar Zentria.bat**
            4. Acepta los permisos de administrador si Windows lo pide
            5. ¡Listo! Zentria CLI se abrirá automáticamente
